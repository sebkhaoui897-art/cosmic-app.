name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer init || true
          sed -i 's/#title = My Application/title = Cosmic Guide/' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = cosmicguide/' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = org.cosmic/' buildozer.spec
          sed -i 's/#source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py/' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3/' buildozer.spec
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
